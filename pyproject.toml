[project]
name = "4-sales-dashboard-main"
version = "0.1.0"
description = "KPI sales dashboard built with Plotly Dash"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
readme = "README.MD"
requires-python = ">=3.10,<3.11"
dependencies = [
    "dash==2.7.1",
    "dash-bootstrap-components==1.2.1",
    "dash-core-components==2.0.0",
    "dash-html-components==2.0.0",
    "dash-table==5.0.0",
    "dash-daq==0.5.0",
    "flask==2.2.2",
    "werkzeug==2.2.2",
    "pandas==1.5.2",
    "numpy==1.23.5",
    "plotly==5.11.0",
    "gunicorn==20.1.0",
    "setuptools>=65.5.1,<80",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
